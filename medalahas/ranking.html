<!DOCTYPE html> <!-- Define o tipo de documento como HTML5 -->
<html lang="pt-BR"> <!-- Define o idioma da página como português do Brasil -->
  <head>
    <meta charset="UTF-8" /> <!-- Define a codificação de caracteres como UTF-8 (suporta acentos) -->
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <!-- Garante que a página seja responsiva em dispositivos móveis -->
    
    <meta
      name="description"
      content="Quadro de medalhas dos jogos olímpicos (Olimpíadas) de Paris 2024."
    /> 
    <!-- Descrição da página (importante para SEO e acessibilidade) -->
    
    <title>Quadro de medalhas</title> <!-- Título exibido na aba do navegador -->
  </head>
  
  <body>
    <!-- Título principal da página -->

            <tr>
                <th>País</th>   <!-- Nome do país -->
                <th>Ouro</th>   <!-- Medalhas de ouro -->

                <th>Bronze</th> <!-- Medalhas de bronze -->
                <th>Total</th>  <!-- Total de medalhas -->
            </tr>
        </thead>
        
        <!-- Corpo da tabela: contém os dados -->
        <tbody>
            <tr>
                <td>EUA</td>

                <td>Austrália</td>

            <tr>
                <td>França</td>
                <td>16</td>
                <td>26</td>
                <td>22</td>
                <td>64</td>
            </tr>
        </tbody>   
        
        <!-- Rodapé da tabela: mostra o total geral -->
        <tfoot>
            <tr>
                <th>Total</th>
                <th>134</th>  <!-- Soma das medalhas de ouro -->
                <th>128</th>  <!-- Soma das medalhas de prata -->
                <th>117</th>  <!-- Soma das medalhas de bronze -->
                <th>379</th>  <!-- Soma geral -->
            </tr>
        </tfoot>
    </table>
    <!-- Fim da tabela -->
     <br>
     <br>
     <a href="../index.html">Voltar para Home</a>

</html>
